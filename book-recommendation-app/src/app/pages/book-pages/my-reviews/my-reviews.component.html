<!DOCTYPE html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My reviews</title>

  <link rel="stylesheet" href="../../../../assets/css/bootstrap.css"/>
  <link rel="stylesheet" href="../../../../assets/css/all.min.css"/>
</head>

<body>
<img class="bookshelf-img-container" src="../../../../assets/images/bookshelf.jpg" alt="bookshelf">
<div class="books-container">
  <h1>Hello, {{ userName }}!</h1>
  <h3 *ngIf="totalReviews < 20">
    You currently have {{ totalReviews }} reviews. Review at least 20 books to unlock personalized book recommendations!
  </h3>
  <h3 *ngIf="totalReviews >= 20">
    Congratulations! You are eligible for personalized book recommendations.
    <!--        <button (click)="requestRecommendations()" class="btn btn-primary">Get Personalized Recommendations</button>-->
  </h3>
  <h2>Yours reviews:</h2>
  <div class="row">
    @for (book of reviews; track book) {
      <div class="col-md-3">
        <app-book-preview [book]="book"></app-book-preview>
      </div>
    }
  </div>
  <div class="pagination">
    <button (click)="previousPage()" [disabled]="currentPage <= 1">Previous</button>
    <button (click)="nextPage()" [disabled]="currentPage >= totalPages">Next</button>
  </div>
</div>
</body>
